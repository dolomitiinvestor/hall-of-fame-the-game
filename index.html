<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0806" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Draft any Pro Football Hall of Famer, at their career-best season, and run a fantasy season." />
  <title>Hall of Fame</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="splash-overlay" class="splash-overlay" hidden>
    <div class="splash-content">
      <button class="splash-close" id="splash-close" aria-label="Close">&times;</button>
      <img class="splash-logo" src="img/main-logo.jpg" alt="Hall of Fame" />
    </div>
    <audio id="splash-audio" src="audio/time-to-rumble.mp3" loop preload="auto"></audio>
  </div>

  <div id="week-splash-overlay" class="splash-overlay" hidden>
    <div class="splash-content">
      <button class="splash-close" id="week-splash-close" aria-label="Close">&times;</button>
      <img class="splash-logo" src="img/main-logo.jpg" alt="Hall of Fame" />
      <p class="week-splash-text" id="week-splash-text"></p>
      <div id="week-splash-injuries"></div>
    </div>
  </div>

  <div id="player-card-overlay" class="fullscreen-overlay" hidden>
    <button class="splash-close fullscreen-close" id="player-card-close" aria-label="Close">&times;</button>
    <div id="player-card-body" class="fullscreen-body"></div>
  </div>

  <div id="game-fullscreen-overlay" class="fullscreen-overlay" hidden>
    <button class="splash-close fullscreen-close" id="game-fullscreen-close" aria-label="Close">&times;</button>
    <div id="game-fullscreen-body" class="fullscreen-body"></div>
  </div>

  <header class="site-header">
    <h1>🏈 Hall of Fame</h1>
    <nav class="main-nav">
      <button class="nav-btn active" data-screen="setup">League Settings</button>
      <button class="nav-btn" data-screen="draft">Draft</button>
      <button class="nav-btn" data-screen="teams">Teams</button>
      <button class="nav-btn" data-screen="players">Players</button>
      <button class="nav-btn" data-screen="season">Season</button>
      <button class="nav-btn" data-screen="games">Games</button>
      <button class="nav-btn" data-screen="faq">FAQ</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <p>Prototype v1 &middot; Scoring format set in Setup &middot; Data is a hand-compiled approximation for gameplay purposes.</p>
    <p>&copy; 2026 DolomitiVentures. An independent fan project. Not affiliated with or endorsed by any professional sports league or team.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
